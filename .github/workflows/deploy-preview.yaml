name: Upload Preview Deployment

on:
  workflow_run:
    workflows: ["Build Preview Deployment"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: Deploy Preview to Cloudflare Workers
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        id: preview-build-artifact
        with:
          name: preview-build
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Write Wrangler configuration
        run: |
          cat > build/wrangler.toml <<'EOF'
          name = "being-healthy-preview"
          compatibility_date = "2026-09-11"

          [assets]
          directory = "./"
          EOF

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Deploy preview assets to Cloudflare Workers
        run: wrangler deploy
        working-directory: build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
